version: 2

# Example source: Snowflake's built-in sample data, so the project runs on any account.
# Replace with your raw/landing tables.
sources:
  - name: tpch
    database: "{{ var('tpch_database', 'SNOWFLAKE_SAMPLE_DATA') }}"
    schema: TPCH_SF1
    # Freshness is checked by `dbt source freshness` before every pipeline run.
    # Enable on real sources that have a load timestamp:
    # config:
    #   loaded_at_field: _loaded_at
    #   freshness:
    #     warn_after: {count: 12, period: hour}
    #     error_after: {count: 24, period: hour}
    tables:
      - name: orders
      - name: customer
      - name: nation
